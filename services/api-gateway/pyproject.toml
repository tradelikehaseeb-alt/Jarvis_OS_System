[project]
name = "jarvis-api-gateway"
version = "0.0.0"
description = "Jarvis OS API gateway (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.34.0,<0.35",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.9.0,<3",
  "python-dotenv>=1.1.0,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
